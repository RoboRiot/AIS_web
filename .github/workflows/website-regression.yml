name: Website regression checks
on:
  push:
    branches: [master]
  pull_request:
permissions:
  contents: read
jobs:
  regression:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22.23.4
          cache: npm
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run postinstall
      - run: npm test
      - run: npm run lint
      # Production credentials are deliberately not available to this job.
      # Build, exact-release HTTP checks and browser postflight are separate gates.
